name: Android distribution (RobPublisher)
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: Solo versiones oficiales
        options: [release]
        default: release
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  distribute:
    uses: ./.github/workflows/android-distribution-engine.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      deployments: read
    with:
      source_sha: ${{ github.sha }}
      channel: release
