name: Android distribution (RobPublisher)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  distribute:
    uses: ./.github/workflows/android-distribution-engine.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      deployments: read
    with:
      source_sha: ${{ github.sha }}
      channel: release
