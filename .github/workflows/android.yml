name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable Gradle Wrapper
        run: chmod +x gradlew
      - name: Test, lint and compile
        run: ./gradlew test lint assembleDebug assembleRelease --no-daemon
      - name: Check whitespace
        run: |
          git diff --check
          python3 tools/check_rs04_regressions.py
          test -z "$(git ls-files '*.apk' '*.aab' '*.jks' '*.keystore' '*.key')"
      - name: Verify APK identity, alignment, signature and SHA-256
        run: python3 tools/verify_rs04_apks.py
      - name: Summarize audit evidence
        if: always()
        run: |
          python3 tools/summarize_rs03.py --output app/build/rs04-summary
          cat app/build/rs04-summary/resultados.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test, lint and Robolectric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs04-validation-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/test-results/test*UnitTest/TEST-*.xml
            app/build/reports/tests/
            app/build/reports/lint-results*
            app/build/rs03-evidence/
            app/build/rs04-summary/
            app/build/rs04-evidence/
            app/build/rs04-dev/verificacion.md
      - name: Upload installable RobStore DEV APK (trusted internal PR only)
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: robstore-dev-${{ github.event.pull_request.head.sha }}
          retention-days: 30
          if-no-files-found: error
          path: app/build/rs04-dev/
