name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Only an internal PR in RobStore may create the temporary Android Debug key.
      TRUSTED_INTERNAL_PR: ${{ github.event_name == 'pull_request' && github.repository == 'robdor80/RobStore' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable Gradle Wrapper
        run: chmod +x gradlew
      - name: Test, lint and compile
        run: |
          init_args=(-I tools/unsigned-validation.gradle)
          if [[ "$TRUSTED_INTERNAL_PR" == 'true' ]]; then
            init_args=()
          fi
          ./gradlew "${init_args[@]}" test lint lintRelease assembleDebug assembleRelease --no-daemon
      - name: Check whitespace
        run: |
          git diff --check
          python3 tools/check_rs04_regressions.py
          python3 tools/check_rs05_regressions.py
          test -z "$(git ls-files '*.apk' '*.aab' '*.jks' '*.keystore' '*.key')"
      - name: Validate distribution tooling without production keys
        run: |
          python3 -m unittest discover -s tools -p test_distribution.py -v
          python3 -m unittest discover -s tools -p test_distribution_signed.py -v
          python3 -m unittest discover -s tools -p test_mobile_distribution.py -v
          python3 -m unittest discover -s tools -p test_legacy_publications.py -v
          python3 -m unittest discover -s tools -p test_migrate_rs05.py -v
          python3 -m unittest discover -s tools -p test_signing_preflight.py -v
          python3 -m unittest discover -s tools -p test_clear_cuadrante_approvals.py -v
          python3 tools/check_distribution_secrets.py
      - name: Verify APK identity, alignment, signature and SHA-256
        run: |
          verify_args=(--unsigned-debug)
          if [[ "$TRUSTED_INTERNAL_PR" == 'true' ]]; then
            verify_args=()
          fi
          python3 tools/verify_rs04_apks.py "${verify_args[@]}"
      - name: Reproduce RS-05 unsigned Release build without secrets
        run: |
          ./gradlew -I tools/unsigned-distribution.gradle :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon --no-configuration-cache --no-build-cache
      - name: Summarize audit evidence
        if: always()
        run: |
          python3 tools/summarize_rs03.py --output app/build/rs04-summary
          cat app/build/rs04-summary/resultados.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test, lint and Robolectric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs04-validation-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/test-results/test*UnitTest/TEST-*.xml
            app/build/reports/tests/
            app/build/reports/lint-results*
            app/build/rs03-evidence/
            app/build/rs04-summary/
            app/build/rs04-evidence/
            app/build/rs04-dev/verificacion.md
