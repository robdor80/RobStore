name: Reusable Android distribution engine
on:
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      channel: {type: string, required: true}
# Serialize the complete build/sign/publish operation across channels.
concurrency:
  group: android-official-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  deployments: read
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  CHANNEL: ${{ inputs.channel }}
jobs:
  guard:
    outputs:
      engine_sha: ${{ steps.engine.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: robdor80/RobStore
          ref: main
          persist-credentials: false
      - id: engine
        name: Select central engine once for this distribution
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Owner, source and automatic environment policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/mobile_distribution.py guard --source "$SOURCE_SHA" --channel "$CHANNEL" --config-output "$RUNNER_TEMP/distribution.json"
  build:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: robdor80/RobStore
          ref: ${{ needs.guard.outputs.engine_sha }}
          path: engine
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile without signing secrets
        working-directory: source
        run: |
          chmod +x gradlew
          python3 ../engine/tools/mobile_distribution.py unsigned --source "$SOURCE_SHA" --channel "$CHANNEL" --directory "$RUNNER_TEMP/unsigned"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ inputs.channel }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/unsigned/unsigned.apk
          retention-days: 3
          if-no-files-found: error
  sign:
    outputs:
      tag: ${{ steps.sign.outputs.tag }}
    needs: [guard, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-${{ inputs.channel }}
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: robdor80/RobStore
          ref: ${{ needs.guard.outputs.engine_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ inputs.channel }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/unsigned
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Recheck source before accessing keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/mobile_distribution.py guard --source "$SOURCE_SHA" --channel "$CHANNEL" --config-output "$RUNNER_TEMP/distribution.json"
      - id: sign
        name: Sign in isolation; no Gradle or application scripts
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          CERTIFICATE_SHA256: ${{ vars.CERTIFICATE_SHA256 }}
        run: |
          python3 tools/mobile_distribution.py sign --source "$SOURCE_SHA" --channel "$CHANNEL" --config-output "$RUNNER_TEMP/distribution.json" --apk "$RUNNER_TEMP/unsigned/unsigned.apk" --directory "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-candidate-${{ inputs.channel }}-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/candidate/Android-*.apk
            ${{ runner.temp }}/candidate/robstore-update.json
            ${{ runner.temp }}/candidate/robstore-distribution.json
            ${{ runner.temp }}/candidate/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: [guard, sign]
    env:
      RELEASE_TAG: ${{ needs.sign.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-publish
    permissions:
      contents: write
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: robdor80/RobStore
          ref: ${{ needs.guard.outputs.engine_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-candidate-${{ inputs.channel }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/candidate
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Publish verified signed APK automatically
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATE_SHA256: ${{ inputs.channel == 'release' && vars.RELEASE_CERTIFICATE_SHA256 || vars.DEV_CERTIFICATE_SHA256 }}
        run: |
          python3 tools/mobile_distribution.py publish --execute --source "$SOURCE_SHA" --channel "$CHANNEL" --tag "$RELEASE_TAG" --config-output "$RUNNER_TEMP/distribution.json" --directory "$RUNNER_TEMP/candidate"
